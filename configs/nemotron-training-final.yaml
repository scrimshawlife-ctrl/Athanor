# Athanor Llama-3.1-Nemotron-Nano-8B LoRA Fine-tuning Config
# NVIDIA startup program submission - training Nemotron on GB10

base_model: nvidia/Llama-3.1-Nemotron-Nano-8B-v1
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
load_in_8bit: false
load_in_4bit: true
strict: false
trust_remote_code: true

# Dataset from our candidate pack
datasets:
  - path: /home/delphi/Athanor/data/athanor_train.jsonl
    ds_type: json
    type: completion

dataset_prepared_path: /home/delphi/Athanor/data/athanor_prepared
val_set_size: 0.1
output_dir: /home/delphi/Athanor/lora-out-nemotron

# LoRA config for 8B model on GB10
adapter: lora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

sequence_len: 4096
sample_packing: true
eval_sample_packing: false
pad_to_sequence_len: true

# Disable wandb
wandb_project: ""
wandb_entity: ""
wandb_watch: "false"
wandb_log_model: "false"
use_wandb: false

# Training params
attn_implementation: "sdpa"
gradient_accumulation_steps: 4
micro_batch_size: 2
num_epochs: 3
optimizer: "adamw_bnb_8bit"
lr_scheduler: "cosine"
learning_rate: 2e-5
train_on_inputs: false
group_by_length: false
bf16: true
tf32: false

warmup_steps: 20
save_steps: 50
eval_steps: 50
save_total_limit: 3

device_map: "auto"
