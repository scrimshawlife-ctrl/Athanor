name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -U pip -e ".[dev,schema]" -r specs/contracts/requirements.txt
      - name: Ruff
        run: ruff check src tests specs/contracts/validation.py specs/contracts/verify_review.py scripts/shadow/athanor/apply_gold_p3a.py
      - name: Advisory semantic contracts
        run: python specs/contracts/verify_review.py
      - name: Pytest
        run: pytest -q
